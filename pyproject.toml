[project]
name = "qubitra-openqarp-demo"
version = "0.1.0"
description = "Fujitsu's OpenQARP portfolio diversification running live on Qubitra's hosted simulator, as an interactive dashboard."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Qubitra" }]
requires-python = ">=3.11"
keywords = ["quantum", "openqarp", "qaoa", "portfolio", "marimo", "qubitra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qubitra-sdk[openqarp]>=0.4.3,<0.5",
    "marimo>=0.25",
    "plotly>=6",
    "numpy>=2",
    "networkx>=3.4",
]

[project.urls]
Repository = "https://github.com/Qubitra/openqarp-demo"

[project.scripts]
qubitra-openqarp-demo = "openqarp_demo.cli:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openqarp_demo"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "mypy>=1.19",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A marimo cell returns its public names as a tuple and imports where the story needs them.
"src/openqarp_demo/app.py" = ["B018", "E402"]

[tool.mypy]
# The type checker reads the installed numpy stubs, which use 3.12 syntax.
python_version = "3.12"
strict = true
files = ["src", "tests"]
# The app is a marimo notebook: each cell is a function whose parameters are the names
# other cells define, so its bodies are checked while the untyped cell signatures are not.
exclude = ["src/openqarp_demo/app\\.py$"]

[[tool.mypy.overrides]]
module = ["qarp.*", "qarpx.*", "plotly.*", "networkx.*", "marimo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
